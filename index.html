<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2425 Team</title>
    <meta
      name="description"
      content="2425 Team senior design hub for a search-and-rescue sensing device."
    />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="_next/static/css/0bb5a1be7a9ac24e.css" />
    <link rel="stylesheet" href="_next/static/css/567b6efa152398f0.css" />
    <link rel="stylesheet" href="_next/static/css/1ed43d94fcc44917.css" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body class="ptcom-design__dark__1ny5qy1 theme-dark">
    <div class="hero" aria-hidden="true">
      <img class="hero__still" src="media/hero-still.jpg" alt="" />
      <canvas id="scene"></canvas>
      <div class="hero__veil"></div>
    </div>

    <div class="page">
      <header class="header">
        <div class="header__bar">
          <p class="earmark" id="updated-tag">Updated</p>
          <p class="status earmark">
            <span class="status__dot" aria-hidden="true"></span>
            <span id="project-status">ACTIVE</span>
          </p>
        </div>

        <h1 class="headline" id="project-name">2425 Team</h1>
        <p class="dek" id="project-desc"></p>

        <nav class="nav" aria-label="Sections">
          <a href="#decisions">Decisions</a>
          <a href="#links">Links</a>
          <a href="#glossary">Glossary</a>
          <a href="#team">Team</a>
          <a href="#milestones">Milestones</a>
        </nav>
      </header>

      <main>
        <section class="section" id="decisions" data-reveal>
          <h2 class="section__title earmark">Decisions</h2>
          <div class="tbd" id="decisions-list">
            <p class="tbd__label earmark">TBD</p>
            <p class="tbd__copy">No decisions logged yet.</p>
          </div>
        </section>

        <section class="section" id="links" data-reveal>
          <h2 class="section__title earmark">Links</h2>
          <div class="links" id="links-row"></div>
        </section>

        <section class="section" id="glossary" data-reveal>
          <h2 class="section__title earmark">Glossary</h2>
          <dl class="glossary" id="glossary-list"></dl>
        </section>

        <section class="section" id="team" data-reveal>
          <h2 class="section__title earmark">Team</h2>
          <div class="team-grid" id="team-grid"></div>
        </section>

        <section class="section" id="milestones" data-reveal>
          <h2 class="section__title earmark">Milestones</h2>
          <div class="timeline" id="timeline"></div>
        </section>
      </main>

      <footer class="footer">
        <p class="earmark">Internal</p>
        <p class="earmark" id="footer-stamp"></p>
      </footer>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
