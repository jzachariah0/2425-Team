  "briefing": {
    "body": "POC parts finalized: ESP32, LD2410C and LD2450 mmWave sensors, TFT touch display, and a power bank in place of a battery management circuit for this phase. Ordering underway. Significant progress made on the command center dashboard, with an early build already matching the team's vision for the fleet view concept. The demo dashboard will run on static, representative data rather than a live device connection, keeping build speed up now without forcing rework once the real product architecture exists. Actual product hardware ordering is intentionally held until after Wednesday's meeting with Dr. Skinner, keeping this week's focus on the proposal, PDR readiness, and the POC demo.",

    {
      "date": "2026-09-18",
      "decision": "Hera Beacon is handheld, not throwable",
      "reason": "The team's POC direction, an individual display on the device itself, confirmed handheld as the working design. Reasoning: physical rescue always requires a responder to eventually approach the survivor directly, so an operator carried device does not introduce a fundamentally new category of risk beyond what rescue already requires. Open item for testing: detection range and signal penetration through debris draw on the same power budget, so whether the device's realistic standoff distance provides a meaningful safety margin over close range needs empirical validation, this is part of the RF and rebar characterization already planned."
    },
    {
      "date": "2026-09-17",
      "decision": "POC dashboard runs locally, not through AWS",
      "reason": "Standing up real AWS infrastructure, device certificates, IAM permissions, an actual cloud connected dashboard, is genuine additional engineering work that does not serve what the POC is actually meant to prove, that the sensors and display pipeline work. A local dashboard the ESP32 serves on its own WiFi network proves the same core capability and is faster to build, which matters given the deadline. AWS remains the settled choice for the real fleet system later, once multiple deployed pods actually need centralized data aggregation."
    },
    {
      "date": "2026-09-17",
      "decision": "Use AWS as the cloud provider for Hera",
      "reason": "Google discontinued its equivalent service, Cloud IoT Core, back in 2023, so AWS is the only one of the two that still has a real, purpose built product for connecting and managing sensor devices at all."
